version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "00:00"
    cooldown:
      default-days: 30
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
      time: "00:00"
    cooldown:
      default-days: 30
    groups:
      fuzz-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "00:00"
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns: ["*"]
