name: Fuzzing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  database:
    name: Database State Machine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-fuzz@0.13.2

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            fuzz -> target
          cache-directories: fuzz/corpus

      - name: Select fuzz duration
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "FUZZ_SECONDS=900" >> "$GITHUB_ENV"
          else
            echo "FUZZ_SECONDS=60" >> "$GITHUB_ENV"
          fi

      - name: List fuzz targets
        run: cargo +nightly fuzz list

      - name: Run database fuzz target
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          RUSTFLAGS: -C link-arg=-no-pie
        run: cargo +nightly fuzz run database -- -max_total_time="$FUZZ_SECONDS" -timeout=10

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7
