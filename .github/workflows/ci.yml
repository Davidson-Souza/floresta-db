name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, Lint, and Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libboost-all-dev

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component clippy,rustfmt --no-self-update

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: ./_typos.toml

      - name: Check formatting
        run: cargo +nightly fmt --all --check

      - name: Run Clippy
        run: cargo +nightly clippy --all-targets --all-features --locked -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +nightly doc --no-deps --all-features --document-private-items --locked

      - name: Test documentation
        run: cargo +nightly test --doc --all-features --locked

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSRV 1.85
            toolchain: 1.85.0
            feature-args: --no-default-features
          - name: Stable All Features
            toolchain: stable
            feature-args: --all-features

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libboost-all-dev

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.feature-args }}

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --all-targets ${{ matrix.feature-args }} --locked

      - name: Build release artifacts
        run: cargo +${{ matrix.toolchain }} build --release ${{ matrix.feature-args }} --locked

  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AArch64
            os: ubuntu-24.04-arm
          - name: macOS AArch64
            os: macos-15
          - name: macOS x86-64
            os: macos-15-intel
          - name: Windows AArch64 Compile Guard
            os: windows-11-arm
          - name: Windows x86-64 Compile Guard
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}-1.85.0

      - name: Run platform tests
        run: cargo +1.85.0 test --all-targets --no-default-features --locked

      - name: Build platform release
        run: cargo +1.85.0 build --release --no-default-features --locked

  riscv:
    name: Linux RISC-V 64 under QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Install cross
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cross@0.2.5

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: riscv64gc-unknown-linux-gnu-1.85.0

      - name: Run RISC-V tests
        run: cross +1.85.0 test --target riscv64gc-unknown-linux-gnu --no-default-features --locked

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust with Miri
        run: rustup toolchain install nightly --profile minimal --component miri --no-self-update

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare Miri
        run: cargo +nightly miri setup

      - name: Run Miri tests
        run: cargo +nightly miri test --locked
