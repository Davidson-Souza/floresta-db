name: Commits

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Signatures and Messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Check commit policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash contrib/check-commits.sh "origin/${BASE_REF}"

      - name: Check patch whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
