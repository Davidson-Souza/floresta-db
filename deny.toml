# SPDX-License-Identifier: MIT OR Apache-2.0

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "CC0-1.0", # Optional rust-bitcoin, secp256k1, and hintsfile stack.
    "MIT",
    "MITNFA", # hex_lit, a transitive dependency of rust-bitcoin.
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
