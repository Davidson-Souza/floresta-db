[package]
name = "db-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A CAS-only concurrent mmap database experiment"
license = "MIT OR Apache-2.0"

[dependencies]
bitcoin = { version = "0.32.7", optional = true }
corepc-client = { version = "0.16.0", features = ["client-sync"], optional = true }

[features]
default = []
bitcoin-load = ["dep:bitcoin", "dep:corepc-client"]

[[bin]]
name = "bitcoin-load"
path = "src/bin/bitcoin_load/main.rs"
required-features = ["bitcoin-load"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
